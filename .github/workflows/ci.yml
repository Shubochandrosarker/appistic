name: Appistic CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appistic_test
          POSTGRES_PASSWORD: appistic_test_password
          POSTGRES_DB: appistic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appistic_test -d appistic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://appistic_test:appistic_test_password@127.0.0.1:5432/appistic_test
      AUTH_SECRET: ci-only-auth-secret-that-is-at-least-32-characters-long
      PUBLIC_BASE_URL: http://localhost:3300
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:db
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
